<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="A menu list with a bread, an ice cream flavor and a topping, each with an editable price"><title>A menu list with a bread, an ice cream flavor and a topping, each with an editable price</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD3D6"/><stop offset="1" stop-color="#FFF1E4"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8A3A3A" flood-opacity=".2"/></filter></defs><style>text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:22px;font-weight:800;fill:#3B1A12}.h{font-size:12px;font-weight:700;fill:#B79A92;letter-spacing:.08em}.n{font-size:17px;font-weight:700;fill:#3B1A12}.s{font-size:12px;fill:#7A5A52}.p{font-size:16px;font-weight:800;fill:#3B1A12}.b{font-size:13px;font-weight:700;fill:#fff}@keyframes swap{0%,38%{opacity:1}42%,92%{opacity:0}96%,100%{opacity:1}}@keyframes swap2{0%,38%{opacity:0}42%,92%{opacity:1}96%,100%{opacity:0}}@keyframes ring{0%,34%{stroke-opacity:0}40%,90%{stroke-opacity:1}96%,100%{stroke-opacity:0}}.o{animation:swap 8s ease infinite}.w{animation:swap2 8s ease infinite}.r{animation:ring 8s ease infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.w{opacity:0}}</style><rect width="600" height="360" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="548" height="308" rx="24" fill="#fff" filter="url(#sh)"/><text class="t" x="52" y="66">Menu &amp; Prices</text><rect x="448" y="44" width="100" height="32" rx="16" fill="#D63D58"/><text class="b" x="498" y="64" text-anchor="middle">+ Add item</text><text class="h" x="52" y="106">BREAD</text><circle cx="64" cy="134" r="12" fill="#E8C9A3"/><text class="n" x="88" y="133">Plain White Bread</text><text class="s" x="88" y="150">159 in stock</text><rect x="448" y="118" width="100" height="32" rx="16" fill="#FFF1E4" stroke="#EAD3CF" stroke-width="2"/><text class="p o" x="498" y="140" text-anchor="middle">Rp 6.000</text><text class="p w" x="498" y="140" text-anchor="middle">Rp 6.500</text><rect class="r" x="446" y="116" width="104" height="36" rx="18" fill="none" stroke="#D63D58" stroke-width="2.5" stroke-opacity="0"/><path d="M52 166H548" stroke="#EAD3CF" stroke-width="2"/><text class="h" x="52" y="190">ICE CREAM</text><circle cx="64" cy="218" r="12" fill="#F7A3B6"/><text class="n" x="88" y="217">Strawberry</text><text class="s" x="88" y="234">115 in stock</text><rect x="448" y="202" width="100" height="32" rx="16" fill="#FFF1E4" stroke="#EAD3CF" stroke-width="2"/><text class="p" x="498" y="224" text-anchor="middle">Rp 8.000</text><path d="M52 250H548" stroke="#EAD3CF" stroke-width="2"/><text class="h" x="52" y="274">TOPPING</text><circle cx="64" cy="297" r="12" fill="#CFE6EA"/><text class="n" x="88" y="297">Rainbow Sprinkles</text><rect x="448" y="280" width="100" height="26" rx="13" fill="#FFF1E4" stroke="#EAD3CF" stroke-width="2"/><text class="p" x="498" y="298" text-anchor="middle" style="font-size:14px">Rp 3.000</text></svg>

services:
  nginx:
    image: nginx:alpine
    container_name: brread-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brread-app
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
